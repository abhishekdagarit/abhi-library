<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abhi's Library — Reading Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          perspective: {
            '1000': '1000px',
          },
        }
      }
    }
  </script>
  <!-- Soft glass surfaces and editorial details -->
  <style>
    .library-backdrop {
      background:
        radial-gradient(ellipse at 4% 0%, rgba(226, 219, 202, .68), transparent 34%),
        radial-gradient(ellipse at 100% 14%, rgba(202, 216, 207, .62), transparent 32%),
        radial-gradient(ellipse at 72% 100%, rgba(224, 208, 191, .5), transparent 35%),
        #f4f3ef;
    }
    .glass-panel {
      background: rgba(255, 255, 255, .56);
      border: 1px solid rgba(255, 255, 255, .78);
      box-shadow: 0 30px 90px rgba(56, 57, 48, .09), inset 0 1px 0 rgba(255, 255, 255, .9);
      -webkit-backdrop-filter: blur(30px) saturate(130%);
      backdrop-filter: blur(30px) saturate(130%);
    }
    .glass-book {
      background: rgba(255, 255, 255, .38);
      border: 1px solid rgba(255, 255, 255, .62);
      box-shadow: 0 8px 24px rgba(61, 57, 50, .045), inset 0 1px 0 rgba(255, 255, 255, .62);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
      backdrop-filter: blur(20px) saturate(130%);
    }
    .glass-book:hover {
      background: rgba(255, 255, 255, .72);
      border-color: rgba(255, 255, 255, .94);
      box-shadow: 0 18px 42px rgba(61, 57, 50, .11), inset 0 1px 0 white;
    }
    .cover-shadow { box-shadow: 0 12px 26px rgba(48, 43, 36, .14); }
    .glass-review {
      background: rgba(255, 255, 255, .52);
      border: 1px solid rgba(255, 255, 255, .76);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), 0 12px 30px rgba(54, 49, 42, .06);
      -webkit-backdrop-filter: blur(22px) saturate(135%);
      backdrop-filter: blur(22px) saturate(135%);
    }
    .serif { font-family: 'Playfair Display', Georgia, serif; }
    .sans { font-family: 'DM Sans', sans-serif; }
    .book-cover { background: linear-gradient(145deg, rgba(255,255,255,.9), rgba(239,237,230,.72)); }
    .cover-placeholder { background: radial-gradient(ellipse at 10% 5%, rgba(255,255,255,.9), transparent 55%), linear-gradient(145deg, #e7e5dc, #d6d9d0); }
    .filter-chip { transition: color .2s ease, background .2s ease, box-shadow .2s ease; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
    @supports not ((backdrop-filter: blur(1px))) {
      .glass-panel, .glass-book { background: rgba(250, 248, 243, 0.94); }
    }
  </style>
  <!-- React & ReactDOM CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
  <body class="bg-[#f4f3ef] text-stone-800 sans">

  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [activeFilter, setActiveFilter] = React.useState('all');
      const [selectedBook, setSelectedBook] = React.useState(null);
      const [books, setBooks] = React.useState([]);
      const [booksLoading, setBooksLoading] = React.useState(true);
      const [booksError, setBooksError] = React.useState(false);

      React.useEffect(() => {
        fetch('./books.json')
          .then((response) => {
            if (!response.ok) throw new Error('Could not load books.json');
            return response.json();
          })
          .then((data) => {
            if (!Array.isArray(data)) throw new Error('books.json must contain a list of books');
            setBooks(data);
          })
          .catch((error) => {
            console.error('Unable to load the book collection:', error);
            setBooksError(true);
          })
          .finally(() => setBooksLoading(false));
      }, []);

      const filters = [
        { id: 'all', label: 'All books' },
        { id: 'read', label: 'Read' },
        { id: 'reading', label: 'Reading' },
        { id: 'to-read', label: 'To read' }
      ];
      const statusLabels = { read: 'Read', reading: 'Reading', 'to-read': 'To read' };
      const filteredBooks = activeFilter === 'all'
        ? books
        : books.filter((book) => book.status === activeFilter);

      React.useEffect(() => {
        if (!selectedBook) return;
        const handleKeyDown = (event) => {
          if (event.key === 'Escape') setSelectedBook(null);
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [selectedBook]);

      return (
        <div className="library-backdrop min-h-screen px-3 py-5 text-[#292a27] sm:px-6 sm:py-10">
          <div className="mx-auto max-w-6xl">
            <header className="mb-7 flex items-center justify-between px-1 sm:mb-10">
              <a href="#top" className="flex items-center gap-3 text-sm font-semibold tracking-tight text-[#30312c]" aria-label="Reading Room home">
                <span className="flex h-9 w-9 items-center justify-center rounded-xl border border-white/80 bg-white/55 text-base shadow-sm">✳</span>
                <span>reading room<span className="text-[#a3a096]">.</span></span>
              </a>
              <span className="rounded-full border border-white/75 bg-white/40 px-3 py-1.5 text-[10px] font-semibold uppercase tracking-[.16em] text-[#77776e]">Personal collection</span>
            </header>

            <section id="top" className="glass-panel relative mb-7 overflow-hidden rounded-[28px] px-5 py-7 sm:mb-9 sm:rounded-[36px] sm:px-10 sm:py-11">
              <div className="pointer-events-none absolute -right-10 -top-20 h-64 w-64 rounded-full border border-white/50 bg-white/15 blur-2xl"></div>
              <div className="relative flex flex-col justify-between gap-8 sm:flex-row sm:items-end">
                <div className="max-w-xl">
                  <p className="mb-3 text-[10px] font-bold uppercase tracking-[.22em] text-[#88877e]">A quiet place for good stories</p>
                  <h1 className="serif text-4xl leading-[1.08] tracking-[-.04em] text-[#30312c] sm:text-6xl">Books, in their<br className="hidden sm:block" /> own time.</h1>
                  <p className="mt-4 max-w-sm text-sm leading-6 text-[#77776e]">A small archive of what I’ve read, what I’m reading, and what’s next.</p>
                </div>
                <div className="flex gap-7 border-t border-white/60 pt-5 sm:border-l sm:border-t-0 sm:pl-8 sm:pt-0">
                  <div><p className="serif text-3xl text-[#34352f]">{books.length.toString().padStart(2, '0')}</p><p className="mt-1 text-[9px] font-bold uppercase tracking-[.15em] text-[#8a8980]">In the library</p></div>
                  <div><p className="serif text-3xl text-[#34352f]">{books.filter((book) => book.status === 'read').length.toString().padStart(2, '0')}</p><p className="mt-1 text-[9px] font-bold uppercase tracking-[.15em] text-[#8a8980]">Finished</p></div>
                </div>
              </div>
            </section>

            <main className="glass-panel rounded-[26px] p-4 sm:rounded-[32px] sm:p-8">
              <div className="mb-6 flex flex-col gap-5 sm:mb-8 sm:flex-row sm:items-end sm:justify-between">
                <div>
                  <p className="mb-1 text-[9px] font-bold uppercase tracking-[.2em] text-[#929087]">The catalogue</p>
                  <div className="flex items-baseline gap-3">
                    <h2 className="serif text-2xl text-[#34352f] sm:text-3xl">{activeFilter === 'all' ? 'All books' : statusLabels[activeFilter]}</h2>
                    <span className="text-xs text-[#99988f]">{filteredBooks.length} {filteredBooks.length === 1 ? 'title' : 'titles'}</span>
                  </div>
                </div>
                <nav aria-label="Filter books" className="flex w-fit max-w-full flex-wrap gap-1 rounded-full border border-white/70 bg-white/30 p-1">
                  {filters.map((filter) => (
                    <button key={filter.id} type="button" onClick={() => setActiveFilter(filter.id)} aria-pressed={activeFilter === filter.id}
                      className={`filter-chip rounded-full px-3.5 py-2 text-[11px] font-semibold ${activeFilter === filter.id ? 'bg-[#34352f] text-white shadow-md' : 'text-[#77776e] hover:bg-white/70 hover:text-[#34352f]'}`}>
                      {filter.label}
                    </button>
                  ))}
                </nav>
              </div>
              {booksLoading ? (
                <div className="rounded-2xl border border-white/70 bg-white/25 px-6 py-16 text-center text-sm text-[#77776e]" role="status">Opening the library…</div>
              ) : booksError ? (
                <div className="rounded-2xl border border-white/70 bg-white/25 px-6 py-16 text-center text-sm text-[#77776e]" role="alert">The collection couldn’t be loaded. Check that books.json is available and valid.</div>
              ) : filteredBooks.length === 0 ? (
                <div className="rounded-2xl border border-white/70 bg-white/25 px-6 py-16 text-center text-sm text-[#77776e]">Nothing here yet — a future read is waiting to join this shelf.</div>
              ) : (
                <div className="grid grid-cols-2 gap-3 sm:grid-cols-3 sm:gap-4 lg:grid-cols-4">
                  {filteredBooks.map((book) => (
                    <article key={book.id} role="button" tabIndex={0} aria-label={`Open review for ${book.title}`}
                      onClick={() => setSelectedBook(book)}
                      onKeyDown={(event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); setSelectedBook(book); } }}
                      className="glass-book group min-w-0 cursor-pointer rounded-[20px] p-2.5 text-left transition-all duration-300 hover:-translate-y-1 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#64675c] sm:rounded-[24px] sm:p-3">
                      <div className="cover-shadow book-cover relative mb-3 aspect-[.76] overflow-hidden rounded-[14px] p-2 sm:rounded-[18px] sm:p-3">
                        {book.coverUrl ? (
                          <img src={book.coverUrl} alt={`${book.title} by ${book.author}`} loading="lazy" className="h-full w-full object-contain transition-transform duration-500 group-hover:scale-[1.025]" />
                        ) : (
                          <div className="cover-placeholder flex h-full w-full flex-col justify-between rounded-lg p-3 text-left sm:p-4">
                            <span className="text-[8px] font-bold uppercase tracking-[.16em] text-[#77776e]">{book.author}</span>
                            <span className="serif text-base leading-tight text-[#34352f] sm:text-xl">{book.title}</span>
                          </div>
                        )}
                        <span className="absolute left-2.5 top-2.5 rounded-full border border-white/70 bg-white/70 px-2 py-1 text-[8px] font-bold uppercase tracking-[.12em] text-[#696960] backdrop-blur-md">{statusLabels[book.status]}</span>
                        {book.status === 'read' && <span className="absolute bottom-2.5 right-2.5 rounded-full border border-white/70 bg-white/75 px-2 py-1 text-[9px] font-semibold text-[#70664e] backdrop-blur-md" aria-label={`Rating ${book.rating}`}>★ {book.rating}</span>}
                      </div>
                      <div className="px-1 pb-1">
                        <h3 className="line-clamp-2 min-h-[2.6rem] text-[13px] font-semibold leading-snug text-[#34352f] sm:text-sm">{book.title}</h3>
                        <p className="mt-1 truncate text-[11px] text-[#85847c] sm:text-xs">{book.author}</p>
                      </div>
                    </article>
                  ))}
                </div>
              )}
            </main>
            <footer className="px-2 pb-2 pt-5 text-center text-[10px] tracking-wide text-[#929087]">A personal library, collected one page at a time.</footer>
          </div>
          {selectedBook && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center bg-[#282925]/30 p-3 backdrop-blur-lg sm:p-6"
              onClick={() => setSelectedBook(null)}
            >
              <section
                role="dialog"
                aria-modal="true"
                aria-labelledby="review-title"
                className="glass-panel max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-[28px] p-4 sm:rounded-[32px] sm:p-6"
                onClick={(event) => event.stopPropagation()}
              >
                <div className="mb-4 flex items-start justify-between gap-4">
                  <div>
                    <p className="text-[9px] font-bold uppercase tracking-[0.22em] text-[#77746e]">Your reading notes</p>
                    <h2 id="review-title" className="mt-1 font-serif text-2xl font-semibold text-[#292a27]">{selectedBook.title}</h2>
                    <p className="mt-1 text-sm text-[#74716a]">{selectedBook.author}</p>
                  </div>
                  <button
                    type="button"
                    aria-label="Close review"
                    onClick={() => setSelectedBook(null)}
                    className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-white/70 bg-white/45 text-xl text-[#55564f] transition hover:bg-white/80"
                  >
                    ×
                  </button>
                </div>
                <div className="grid gap-4 sm:grid-cols-[170px_minmax(0,1fr)]">
                  <div className="cover-shadow mx-auto w-full max-w-[170px] overflow-hidden rounded-2xl bg-white/50 p-2 sm:mx-0">
                    {selectedBook.coverUrl ? (
                      <img src={selectedBook.coverUrl} alt={`${selectedBook.title} cover`} className="max-h-64 w-full object-contain" />
                    ) : (
                      <div className="cover-placeholder flex aspect-[.76] flex-col justify-between rounded-xl p-4">
                        <span className="text-[9px] font-bold uppercase tracking-[.16em] text-[#77776e]">{selectedBook.author}</span>
                        <span className="serif text-xl leading-tight text-[#34352f]">{selectedBook.title}</span>
                      </div>
                    )}
                  </div>
                  <div className="glass-review rounded-2xl p-4 sm:p-5">
                    <div className="mb-3 flex items-center justify-between gap-3 border-b border-white/70 pb-3">
                      <span className="text-[9px] font-bold uppercase tracking-[0.2em] text-[#77746e]">Review</span>
                      {selectedBook.status === 'read' && (
                        <span className="rounded-full bg-amber-100/90 px-2.5 py-1 text-xs font-bold text-amber-800">
                          ★ {selectedBook.rating}
                        </span>
                      )}
                    </div>
                    <p className="whitespace-pre-wrap text-sm leading-7 text-[#45463f]">{selectedBook.review}</p>
                  </div>
                </div>
              </section>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abhi's Library</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          perspective: {
            '1000': '1000px',
          },
        }
      }
    }
  </script>
  <!-- Custom utility styles for 3D card flipping -->
  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .library-backdrop {
      background:
        radial-gradient(ellipse at 12% 8%, rgba(246, 220, 190, 0.95), transparent 34%),
        radial-gradient(ellipse at 90% 12%, rgba(196, 210, 198, 0.92), transparent 32%),
        radial-gradient(ellipse at 75% 90%, rgba(224, 197, 177, 0.78), transparent 38%),
        linear-gradient(135deg, #e8e4dc 0%, #d8d6d0 48%, #ece8e0 100%);
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.68);
      box-shadow: 0 24px 80px rgba(68, 61, 52, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.74);
      -webkit-backdrop-filter: blur(28px) saturate(145%);
      backdrop-filter: blur(28px) saturate(145%);
    }
    .glass-book {
      background: rgba(255, 255, 255, 0.36);
      border: 1px solid rgba(255, 255, 255, 0.58);
      box-shadow: 0 8px 26px rgba(61, 57, 50, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.72);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
      backdrop-filter: blur(18px) saturate(135%);
    }
    .glass-book:hover {
      background: rgba(255, 255, 255, 0.54);
      box-shadow: 0 16px 34px rgba(61, 57, 50, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.86);
    }
    .cover-shadow { box-shadow: 0 9px 20px rgba(48, 43, 36, 0.2); }
    .glass-review {
      background: rgba(255, 255, 255, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 12px 30px rgba(54, 49, 42, 0.08);
      -webkit-backdrop-filter: blur(22px) saturate(145%);
      backdrop-filter: blur(22px) saturate(145%);
    }
    @supports not ((backdrop-filter: blur(1px))) {
      .glass-panel, .glass-book { background: rgba(250, 248, 243, 0.94); }
    }
  </style>
  <!-- React & ReactDOM CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f8f5f1] text-stone-800 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [activeFilter, setActiveFilter] = React.useState('all');
      const [selectedBook, setSelectedBook] = React.useState(null);

      const books = [
        {
          id: 1,
          title: "The Vegetarian",
          author: "Han Kang",
          rating: "5/5",
          status: "read",
          review: "I read the book and I was shocked!, Its a very disturbing one. Probably one of the most disturbing books I have ever read. Its easy to read (I mean the language is easy to follow), but the way it stayed with me, days, weeks and months after is crazy. Just because of the impact the book had on me, I have to give it 5/5.",
          coverType: "image",
          coverUrl: "book_covers/the-vegetarian.jpg"
        },
        {
          id: 2,
          title: "Ghost Wall",
          author: "Sarah Moss",
          rating: "2/5",
          status: "read",
          review: "I read the book and through almost 95% of the book. I was like what the fuck am I reading it doesn’t make any sense as there’s nothing happening. In the end, what happens is what I have had an inclination would happen, but when I kept the book down, it still gave me that feeling of WOW and the feeling of blank stare into nothing!\n\nIn short, I like the book, even though it’s been a really difficult book to finish, because like I said, for 95% of the book, I was like what the fuck is this.\n\nButtttt that feeling is short lived. Initial rating was 3.95/5. And now it’s 2/5",
          coverType: "image",
          coverUrl: "book_covers/ghost-wall.jpg"
        },
        {
          id: 3,
          title: "Tree",
          author: "Aya Kōda",
          rating: "2/5",
          status: "reading",
          review: "I am still reading this book, not sure how I feel about it yet. I sometimes feel like I want to like this book but sometimes it just seems ridiculous!",
          coverType: "image",
          coverUrl: "book_covers/tree.jpg"
        },
        {
          id: 4,
          title: "Butter",
          author: "Asako Yuzuki",
          rating: "0/5",
          status: "to-read",
          review: "I have seen this book quite a few places, I believe I have also seen it with Palki.",
          coverType: "image",
          coverUrl: "book_covers/butter.jpg"
        }
      ];

      const filters = [
        { id: 'all', label: 'All books' },
        { id: 'read', label: 'Read' },
        { id: 'reading', label: 'Reading' },
        { id: 'to-read', label: 'To read' }
      ];
      const statusLabels = { read: 'Read', reading: 'Reading', 'to-read': 'To read' };
      const filteredBooks = activeFilter === 'all'
        ? books
        : books.filter((book) => book.status === activeFilter);

      React.useEffect(() => {
        if (!selectedBook) return;
        const handleKeyDown = (event) => {
          if (event.key === 'Escape') setSelectedBook(null);
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [selectedBook]);

      return (
        <div className="library-backdrop min-h-screen text-[#282925] font-sans px-3 py-4 sm:px-6 sm:py-8 flex flex-col items-center relative isolate">
          <div className="pointer-events-none absolute -left-24 top-1/3 h-72 w-72 rounded-full bg-white/35 blur-3xl"></div>
          <div className="pointer-events-none absolute -right-20 bottom-8 h-80 w-80 rounded-full bg-[#c2b8aa]/35 blur-3xl"></div>
          <div className="glass-panel relative w-full max-w-7xl rounded-[28px] sm:rounded-[36px] px-4 py-5 sm:px-8 sm:py-7">
          <header className="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between mb-7">
            <div>
              <p className="text-[10px] uppercase tracking-[0.24em] text-[#716b61] font-semibold mb-1.5">Your personal bookshelf</p>
              <h1 className="text-3xl sm:text-4xl font-medium tracking-tight text-[#282925]">My Library</h1>
            </div>
            <div className="flex flex-col items-start sm:items-end gap-2">
              <span className="text-[9px] uppercase tracking-[0.2em] font-bold text-[#77746e]">Filter collection</span>
              <div className="flex flex-wrap gap-1 rounded-full bg-white/35 border border-white/60 p-1 shadow-sm">
                {filters.map((filter) => (
                  <button
                    key={filter.id}
                    type="button"
                    onClick={() => setActiveFilter(filter.id)}
                    className={`rounded-full px-3.5 py-2 text-[11px] font-semibold transition-all ${activeFilter === filter.id ? 'bg-[#292a27] text-white shadow-md' : 'text-[#6d6d67] hover:bg-white/60 hover:text-[#292a27]'}`}
                  >
                    {filter.label}
                  </button>
                ))}
              </div>
            </div>
          </header>

          <main>
            <div className="flex items-end justify-between mb-4">
              <div>
                <p className="text-[9px] uppercase tracking-[0.2em] text-[#77746e] mb-1">A little world of stories</p>
                <h2 className="text-xl sm:text-2xl font-medium tracking-tight text-[#282925]">{activeFilter === 'all' ? 'Book Collection' : statusLabels[activeFilter]}</h2>
              </div>
              <span className="text-[10px] text-[#77746e]">{filteredBooks.length} {filteredBooks.length === 1 ? 'book' : 'books'}</span>
            </div>
            {filteredBooks.length === 0 ? (
              <div className="rounded-2xl border border-white/60 bg-white/25 px-6 py-12 text-center text-sm text-[#6d6d67]">Nothing here yet — a future read is waiting to join this shelf.</div>
            ) : (
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4">
            {filteredBooks.map((book) => {
              return (
                <article
                  key={book.id}
                  role="button"
                  tabIndex={0}
                  aria-label={`Open review for ${book.title}`}
                  onClick={() => setSelectedBook(book)}
                  onKeyDown={(event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                      event.preventDefault();
                      setSelectedBook(book);
                    }
                  }}
                  className="glass-book group min-w-0 cursor-pointer rounded-2xl p-2.5 text-left transition-all duration-300 hover:-translate-y-1 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#64675c] sm:p-3"
                >
                  <div className="cover-shadow relative mb-2.5 aspect-[0.72] overflow-hidden rounded-xl bg-white/55">
                    <img
                      src={book.coverUrl}
                      alt={`${book.title} by ${book.author}`}
                      className="h-full w-full object-contain p-2 sm:p-3"
                    />
                  </div>
                  <div className="flex items-start justify-between gap-1.5">
                    <h3 className="line-clamp-2 min-h-[2.5rem] text-[13px] font-semibold leading-snug text-[#292a27] sm:text-sm">{book.title}</h3>
                    {book.status === 'read' && (
                      <span className="shrink-0 rounded-full border border-amber-200/80 bg-amber-50/90 px-1.5 py-0.5 text-[9px] font-bold text-amber-800" aria-label={`Rating ${book.rating}`}>
                        ★ {book.rating}
                      </span>
                    )}
                  </div>
                  <p className="mt-0.5 truncate text-[11px] sm:text-xs text-[#74716a]">{book.author}</p>
                </article>
              );
            })}
            </div>
            )}
          </main>
          </div>
          {selectedBook && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center bg-[#282925]/35 p-3 backdrop-blur-md sm:p-6"
              onClick={() => setSelectedBook(null)}
            >
              <section
                role="dialog"
                aria-modal="true"
                aria-labelledby="review-title"
                className="glass-panel max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-[28px] p-4 sm:rounded-[32px] sm:p-6"
                onClick={(event) => event.stopPropagation()}
              >
                <div className="mb-4 flex items-start justify-between gap-4">
                  <div>
                    <p className="text-[9px] font-bold uppercase tracking-[0.22em] text-[#77746e]">Your reading notes</p>
                    <h2 id="review-title" className="mt-1 font-serif text-2xl font-semibold text-[#292a27]">{selectedBook.title}</h2>
                    <p className="mt-1 text-sm text-[#74716a]">{selectedBook.author}</p>
                  </div>
                  <button
                    type="button"
                    aria-label="Close review"
                    onClick={() => setSelectedBook(null)}
                    className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-white/70 bg-white/45 text-xl text-[#55564f] transition hover:bg-white/80"
                  >
                    ×
                  </button>
                </div>
                <div className="grid gap-4 sm:grid-cols-[170px_minmax(0,1fr)]">
                  <div className="cover-shadow mx-auto w-full max-w-[170px] overflow-hidden rounded-2xl bg-white/50 p-2 sm:mx-0">
                    <img
                      src={selectedBook.coverUrl}
                      alt={`${selectedBook.title} cover`}
                      className="max-h-64 w-full object-contain"
                    />
                  </div>
                  <div className="glass-review rounded-2xl p-4 sm:p-5">
                    <div className="mb-3 flex items-center justify-between gap-3 border-b border-white/70 pb-3">
                      <span className="text-[9px] font-bold uppercase tracking-[0.2em] text-[#77746e]">Review</span>
                      {selectedBook.status === 'read' && (
                        <span className="rounded-full bg-amber-100/90 px-2.5 py-1 text-xs font-bold text-amber-800">
                          ★ {selectedBook.rating}
                        </span>
                      )}
                    </div>
                    <p className="whitespace-pre-wrap text-sm leading-7 text-[#45463f]">{selectedBook.review}</p>
                  </div>
                </div>
              </section>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>

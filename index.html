<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abhi's Library</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          perspective: {
            '1000': '1000px',
          },
        }
      }
    }
  </script>
  <!-- Custom utility styles for 3D card flipping -->
  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    /* Custom scrollbar for review text */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #e8dfd0;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #bd795e;
      border-radius: 4px;
    }
    .book-card { box-shadow: 0 12px 30px rgba(91, 72, 58, 0.10); }
    .book-card:hover { box-shadow: 0 18px 38px rgba(91, 72, 58, 0.17); }
    .library-paper {
      background-color: #eee7da;
      background-image: radial-gradient(ellipse at 10% 0%, rgba(255, 255, 255, 0.8), transparent 40%), repeating-linear-gradient(0deg, rgba(101, 79, 53, 0.018) 0, rgba(101, 79, 53, 0.018) 1px, transparent 1px, transparent 5px);
    }
    .shelf-card { box-shadow: 0 8px 20px rgba(48, 54, 43, 0.08); }
    .shelf-card:hover { box-shadow: 0 14px 28px rgba(48, 54, 43, 0.16); }
  </style>
  <!-- React & ReactDOM CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f8f5f1] text-stone-800 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [flippedId, setFlippedId] = React.useState(null);
      const [activeFilter, setActiveFilter] = React.useState('all');

      const books = [
        {
          id: 1,
          title: "The Vegetarian",
          author: "Han Kang",
          rating: "5/5",
          status: "read",
          review: "I read the book and I was shocked!, Its a very disturbing one. Probably one of the most disturbing books I have ever read. Its easy to read (I mean the language is easy to follow), but the way it stayed with me, days, weeks and months after is crazy. Just because of the impact the book had on me, I have to give it 5/5.",
          coverType: "image",
          coverUrl: "book_covers/the-vegetarian.jpg"
        },
        {
          id: 2,
          title: "Ghost Wall",
          author: "Sarah Moss",
          rating: "2/5",
          status: "read",
          review: "I read the book and through almost 95% of the book. I was like what the fuck am I reading it doesn’t make any sense as there’s nothing happening. In the end, what happens is what I have had an inclination would happen, but when I kept the book down, it still gave me that feeling of WOW and the feeling of blank stare into nothing!\n\nIn short, I like the book, even though it’s been a really difficult book to finish, because like I said, for 95% of the book, I was like what the fuck is this.\n\nButtttt that feeling is short lived. Initial rating was 3.95/5. And now it’s 2/5",
          coverType: "image",
          coverUrl: "book_covers/ghost-wall.jpg"
        },
        {
          id: 3,
          title: "Tree",
          author: "Aya Kōda",
          rating: "2/5",
          status: "reading",
          review: "I am still reading this book, not sure how I feel about it yet. I sometimes feel like I want to like this book but sometimes it just seems ridiculous!",
          coverType: "image",
          coverUrl: "book_covers/tree.jpg"
        },
        {
          id: 4,
          title: "Butter",
          author: "Asako Yuzuki",
          rating: "0/5",
          status: "to-read",
          review: "I have seen this book quite a few places, I believe I have also seen it with Palki.",
          coverType: "image",
          coverUrl: "book_covers/butter.jpg"
        }
      ];

      const handleFlip = (id) => {
        setFlippedId(flippedId === id ? null : id);
      };

      const filters = [
        { id: 'all', label: 'All books' },
        { id: 'read', label: 'Read' },
        { id: 'reading', label: 'Reading' },
        { id: 'to-read', label: 'To read' }
      ];
      const statusLabels = { read: 'Read', reading: 'Reading', 'to-read': 'To read' };
      const filteredBooks = activeFilter === 'all'
        ? books
        : books.filter((book) => book.status === activeFilter);

      return (
        <div className="library-paper min-h-screen text-[#26382f] font-sans px-4 py-4 sm:px-7 sm:py-5 flex flex-col items-center">
          {/* Header */}
          <header className="w-full max-w-7xl flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between mb-4 pb-4 border-b border-[#26382f]/15">
            <div>
              <p className="text-[10px] uppercase tracking-[0.28em] text-[#a34d38] font-bold mb-1.5">The reading room <span className="text-[#26382f]/40">/</span> Personal catalog</p>
              <h1 className="text-3xl sm:text-4xl font-serif font-medium tracking-tight text-[#26382f]">Abhi's Library<span className="text-[#b6533b]">.</span></h1>
              <p className="text-xs sm:text-sm text-[#647065] mt-1">A record of stories finished, unfolding, and waiting.</p>
            </div>
            <div className="flex flex-col items-start sm:items-end gap-2">
              <span className="text-[10px] uppercase tracking-[0.2em] font-bold text-[#647065]">Browse by status</span>
              <div className="flex flex-wrap gap-1 rounded-xl bg-[#fffaf0]/75 border border-[#26382f]/15 p-1 shadow-sm">
                {filters.map((filter) => (
                  <button
                    key={filter.id}
                    type="button"
                    onClick={() => setActiveFilter(filter.id)}
                    className={`rounded-lg px-3 py-1.5 text-[11px] font-semibold transition-colors ${activeFilter === filter.id ? 'bg-[#26382f] text-[#fffaf0] shadow-sm' : 'text-[#647065] hover:bg-[#e4dac9] hover:text-[#26382f]'}`}
                  >
                    {filter.label}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* Compact editorial shelf: more books visible without scrolling */}
          <main className="w-full max-w-7xl">
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-baseline gap-3">
                <h2 className="font-serif text-lg sm:text-xl text-[#26382f]">{activeFilter === 'all' ? 'Volumes on the shelf' : statusLabels[activeFilter]}</h2>
                <span className="hidden sm:inline text-[9px] uppercase tracking-[0.16em] text-[#a34d38]">Reading room index</span>
              </div>
              <span className="text-[10px] uppercase tracking-[0.16em] text-[#647065]">{String(filteredBooks.length).padStart(2, '0')} {filteredBooks.length === 1 ? 'volume' : 'volumes'}</span>
            </div>
            {filteredBooks.length === 0 ? (
              <div className="rounded-2xl border border-dashed border-[#26382f]/25 bg-[#fffaf0]/50 px-6 py-12 text-center text-sm text-[#647065]">Nothing here yet — a future read is waiting to join this shelf.</div>
            ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 2xl:grid-cols-4 gap-3">
            {filteredBooks.map((book) => {
              const isFlipped = flippedId === book.id;
              return (
                <div 
                  key={book.id} 
                  className="relative h-[156px] cursor-pointer group perspective-1000"
                  onClick={() => handleFlip(book.id)}
                >
                  <div className={`w-full h-full relative transition-transform duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                    
                    {/* FRONT OF CARD */}
                    <div className="shelf-card absolute inset-0 w-full h-full backface-hidden rounded-xl overflow-hidden border border-[#26382f]/15 bg-[#f8f2e7] flex transition-all duration-300 group-hover:-translate-y-0.5">
                      {book.coverType === 'image' ? (
                        <div className="w-[38%] h-full relative shrink-0 overflow-hidden bg-[linear-gradient(135deg,_#e5dccd,_#d5c8b4)]">
                          <img 
                            src={book.coverUrl} 
                            alt={book.title} 
                            className="w-full h-full object-contain p-1 drop-shadow-md transition-transform duration-500 group-hover:scale-[1.03]"
                          />
                          <div className="absolute inset-y-0 right-0 w-8 bg-gradient-to-l from-[#26382f]/[0.08] to-transparent pointer-events-none"></div>
                          <span className="absolute top-2 left-2 rounded-sm bg-[#f8f2e7]/95 px-2 py-1 text-[8px] font-bold uppercase tracking-[0.12em] text-[#26382f] shadow-sm">{statusLabels[book.status]}</span>
                          {book.status === 'read' && (
                            <span className="absolute bottom-2 left-2 rounded-sm bg-[#a34d38] px-2 py-1 text-[10px] font-bold text-[#fffaf0] shadow-sm">
                              ★ {book.rating}
                            </span>
                          )}
                        </div>
                      ) : (
                        <div className={`w-[38%] h-full bg-gradient-to-br ${book.bgGradient} shrink-0 flex items-center justify-center p-3 text-center text-white`}>
                          <span className="font-serif text-sm font-bold leading-snug">{book.title}</span>
                        </div>
                      )}
                      <div className="min-w-0 flex-1 p-3 sm:p-4 flex flex-col justify-between">
                        <div>
                          <div className="flex items-center justify-between gap-2 mb-1">
                            <p className="text-[9px] uppercase tracking-[0.16em] text-[#a34d38] font-bold">{book.status === 'read' ? 'Finished' : book.status === 'reading' ? 'Currently reading' : 'On the list'}</p>
                            <span className="text-[9px] font-mono text-[#26382f]/40">№ {String(book.id).padStart(2, '0')}</span>
                          </div>
                          <h3 className="font-serif text-lg sm:text-xl leading-tight font-medium text-[#26382f]">{book.title}</h3>
                          <p className="text-xs text-[#647065] mt-1">{book.author}</p>
                        </div>
                        <div className="flex items-center justify-between gap-2 border-t border-[#26382f]/15 pt-2">
                          <span className="text-[9px] uppercase tracking-[0.16em] text-[#647065]">{statusLabels[book.status]}</span>
                          <span className="text-[9px] text-[#a34d38] group-hover:text-[#743a2b] transition-colors">Open entry&nbsp; ↗</span>
                        </div>
                      </div>
                    </div>

                    {/* BACK OF CARD */}
                    <div className="shelf-card absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-xl overflow-hidden border border-[#26382f]/15 bg-[#f8f2e7] p-3 sm:p-4 flex flex-col justify-start text-left">
                      <div className="flex items-center justify-between mb-2 pb-2 border-b border-[#26382f]/15">
                        <span className="text-[9px] font-bold uppercase tracking-[0.2em] text-[#a34d38]">Reader's notes</span>
                        {book.status === 'read' && (
                          <span className="bg-[#26382f] text-[#fffaf0] px-2 py-0.5 rounded-sm text-[10px] font-bold">
                            ★ {book.rating}
                          </span>
                        )}
                      </div>
                      
                      <h4 className="font-serif font-medium text-[#26382f] text-base mb-2">{book.title}</h4>
                      
                      {/* Scrollable review container anchored strictly to the top */}
                      <div className="flex-1 overflow-y-auto pr-1 text-[11px] sm:text-xs text-[#4f5d52] leading-relaxed whitespace-pre-wrap custom-scrollbar">
                        {book.review}
                      </div>
                      
                      <div className="mt-2 pt-2 border-t border-[#26382f]/15 text-[9px] text-[#647065] text-center uppercase tracking-[0.16em]">
                        Tap to return to shelf
                      </div>
                    </div>

                  </div>
                </div>
              );
            })}
            </div>
            )}
          </main>

          {/* Footer */}
          <footer className="w-full max-w-7xl mt-8 pt-4 border-t border-[#26382f]/15 text-center text-[10px] uppercase tracking-[0.16em] text-[#647065]">
            Abhi's Library <span className="text-[#a34d38]">·</span> Filed with affection
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
